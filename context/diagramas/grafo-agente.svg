<svg xmlns="http://www.w3.org/2000/svg" width="800" height="470" viewBox="0 -20 800 470" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
  </defs>
  <rect x="0" y="-20" width="800" height="470" fill="#ffffff"/>
  <text x="20" y="-2" font-size="15" font-weight="bold" fill="#222">Grafo del agente YouAutoQA (LangGraph)</text>

  <!-- Flechas -->
  <g stroke="#444" stroke-width="1.6" fill="none" marker-end="url(#arrow)">
    <line x1="90" y1="45" x2="120" y2="45"/>
    <line x1="270" y1="45" x2="330" y2="45"/>
    <line x1="405" y1="70" x2="405" y2="110"/>
    <line x1="485" y1="150" x2="580" y2="118"/>
    <line x1="485" y1="150" x2="580" y2="182"/>
    <line x1="405" y1="190" x2="405" y2="240"/>
    <line x1="405" y1="290" x2="405" y2="320"/>
    <line x1="325" y1="360" x2="270" y2="360"/>
    <line x1="485" y1="360" x2="540" y2="360"/>
    <path d="M195,335 V100 H360 V70" stroke-dasharray="5 4"/>
    <path d="M710,360 H760 V8 H195 V20" stroke-dasharray="5 4"/>
  </g>

  <!-- Nodos (hacen cosas) -->
  <g stroke="#2b5fa3" stroke-width="1.6" fill="#e8f1fb">
    <rect x="120" y="20" width="150" height="50" rx="6"/>
    <rect x="330" y="20" width="150" height="50" rx="6"/>
    <rect x="330" y="240" width="150" height="50" rx="6"/>
    <rect x="120" y="335" width="150" height="50" rx="6"/>
    <rect x="540" y="335" width="170" height="50" rx="6"/>
  </g>
  <g text-anchor="middle" fill="#1a1a1a">
    <text x="195" y="42" font-size="13" font-weight="bold">generateTest</text>
    <text x="195" y="58" font-size="11">LLM genera el .robot</text>
    <text x="405" y="42" font-size="13" font-weight="bold">runTest</text>
    <text x="405" y="58" font-size="11">runner Docker + timeout</text>
    <text x="405" y="262" font-size="13" font-weight="bold">classifyFailure</text>
    <text x="405" y="278" font-size="11">regla "mismo error" + LLM</text>
    <text x="195" y="357" font-size="13" font-weight="bold">fixTest</text>
    <text x="195" y="373" font-size="11">LLM corrige con el error</text>
    <text x="625" y="357" font-size="13" font-weight="bold">askClarification</text>
    <text x="625" y="373" font-size="11">interrupt: pausa y pregunta</text>
  </g>

  <!-- Decisiones (aristas condicionales) -->
  <g stroke="#b36b00" stroke-width="1.6" fill="#fff4e0">
    <polygon points="405,110 485,150 405,190 325,150"/>
    <polygon points="405,320 485,360 405,400 325,360"/>
  </g>
  <g text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">
    <text x="405" y="154">routeAfterRun</text>
    <text x="405" y="364">routeAfterClassify</text>
  </g>

  <!-- Inicio y fin -->
  <g stroke="#555" stroke-width="1.6">
    <rect x="20" y="32" width="70" height="26" rx="13" fill="#eee"/>
    <rect x="580" y="100" width="140" height="36" rx="18" fill="#e3f4e3" stroke="#2e7d32"/>
    <rect x="580" y="164" width="140" height="36" rx="18" fill="#fde7e7" stroke="#c62828"/>
  </g>
  <g text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">
    <text x="55" y="49">START</text>
    <text x="650" y="123">END · done</text>
    <text x="650" y="187">END · fail</text>
  </g>

  <!-- Etiquetas de flechas -->
  <g font-size="11" fill="#333">
    <text x="505" y="122">PASS</text>
    <text x="492" y="196">intentos/tokens</text>
    <text x="492" y="209">agotados</text>
    <text x="413" y="220">classify (falló y quedan intentos)</text>
    <text x="283" y="350">fix</text>
    <text x="500" y="350">ask</text>
    <text x="203" y="225">vuelve a ejecutar</text>
    <text x="540" y="405">respuesta del usuario: attempt = 0,</text>
    <text x="540" y="419">y se vuelve a generar el test</text>
  </g>

  <!-- Leyenda -->
  <g font-size="11" fill="#333">
    <rect x="20" y="425" width="14" height="10" fill="#e8f1fb" stroke="#2b5fa3"/>
    <text x="40" y="434">Nodo: hace algo (LLM, runner)</text>
    <polygon points="250,425 257,422 264,425 257,428" fill="#fff4e0" stroke="#b36b00"/>
    <rect x="250" y="423" width="14" height="10" fill="#fff4e0" stroke="#b36b00"/>
    <text x="270" y="434">Rombo: arista condicional (función pura con tests)</text>
  </g>
</svg>
